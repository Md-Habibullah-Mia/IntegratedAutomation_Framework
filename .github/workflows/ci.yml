name: Automation Suite

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Target environment'
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

jobs:
  web-tests:
    runs-on: ubuntu-latest
    strategy:
      # false: a real, expected failure (odiobuk's SEC-001 security repro
      # always fails until that backend bug is patched) must not cancel the
      # rest of the matrix — the default fail-fast:true was doing exactly
      # that, so medco/massive-market and the other browsers never even ran.
      fail-fast: false
      matrix:
        site: [medco, massive-market, odiobuk]
        browser: [chromium, firefox, webkit]
        # massive-market's admin/marketer coverage performs real, one-shot
        # state changes (approving a real pending request, submitting a real
        # merchant application) against a single shared live account —
        # running it 3x in the same matrix (once per browser) makes the 2nd
        # and 3rd runs fail on stale-state assumptions (e.g. "the request is
        # still pending"), since the 1st run already consumed it. Restrict
        # it to chromium only until those suites are made safe to repeat.
        exclude:
          - site: massive-market
            browser: firefox
          - site: massive-market
            browser: webkit
    env:
      TEST_ENV: ${{ github.event.inputs.test_env || 'dev' }}
      REGISTRATION_TEST_PASSWORD: ${{ secrets.REGISTRATION_TEST_PASSWORD }}
      TEST_PHONE: ${{ secrets.TEST_PHONE }}
      LOGIN_TEST_EMAIL: ${{ secrets.LOGIN_TEST_EMAIL }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
      MASSIVE_MARKET_ADMIN_EMAIL: ${{ secrets.MASSIVE_MARKET_ADMIN_EMAIL }}
      MASSIVE_MARKET_ADMIN_PASSWORD: ${{ secrets.MASSIVE_MARKET_ADMIN_PASSWORD }}
      MOBILE_TEST_EMAIL: ${{ secrets.MOBILE_TEST_EMAIL }}
      MOBILE_TEST_PASSWORD: ${{ secrets.MOBILE_TEST_PASSWORD }}
      MOBILE_TEST_ADMIN_EMAIL: ${{ secrets.MOBILE_TEST_ADMIN_EMAIL }}
      MOBILE_TEST_ADMIN_PASSWORD: ${{ secrets.MOBILE_TEST_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # --grep-invert '@slow' skips the multi-minute narration/generation
      # journeys (odiobuk TC-013/TC-015) — those run on their own via
      # `--grep @slow --workers=1`, not on every push/PR.
      # --workers=1: odiobuk and massive-market both share one login
      # (admin/marketer) across multiple spec files in the same project —
      # Playwright's default parallelism runs those files in different
      # workers simultaneously, which collides on the shared account (extra
      # concurrent logins, state races). Confirmed live via CI run
      # 35741417972 (priority-next.spec.ts and admin-coverage.spec.ts
      # failing from exactly this).
      - run: npx playwright test --project=${{ matrix.site }}-${{ matrix.browser }} --grep-invert "@slow" --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-report-${{ matrix.site }}-${{ matrix.browser }}
          path: reports/html

  api-tests:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ github.event.inputs.test_env || 'dev' }}
      REGISTRATION_TEST_PASSWORD: ${{ secrets.REGISTRATION_TEST_PASSWORD }}
      TEST_PHONE: ${{ secrets.TEST_PHONE }}
      LOGIN_TEST_EMAIL: ${{ secrets.LOGIN_TEST_EMAIL }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
      MASSIVE_MARKET_ADMIN_EMAIL: ${{ secrets.MASSIVE_MARKET_ADMIN_EMAIL }}
      MASSIVE_MARKET_ADMIN_PASSWORD: ${{ secrets.MASSIVE_MARKET_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/api-html

  mobile-tests:
    runs-on: ubuntu-latest
    # Free: boots its own Android emulator on the runner (KVM-accelerated,
    # standard 1x-cost Linux minutes) instead of paying for BrowserStack/Sauce
    # Labs. CLOUD_PROVIDER stays 'local' (env.config.ts's default), so
    # wdio.conf.ts's own 'appium' service starts the Appium server and the
    # emulator-runner step below provides the device it attaches to.
    env:
      CLOUD_PROVIDER: local
      MOBILE_TEST_EMAIL: ${{ secrets.MOBILE_TEST_EMAIL }}
      MOBILE_TEST_PASSWORD: ${{ secrets.MOBILE_TEST_PASSWORD }}
      MOBILE_TEST_ADMIN_EMAIL: ${{ secrets.MOBILE_TEST_ADMIN_EMAIL }}
      MOBILE_TEST_ADMIN_PASSWORD: ${{ secrets.MOBILE_TEST_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # KVM hardware acceleration — without this the emulator falls back to
      # software rendering and is too slow to be usable in CI.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # apps/memorywave_v2.apk is gitignored (large binary build output), so
      # it isn't in the checkout. Pulled instead from a GitHub Release asset
      # tagged "mobile-apk" — re-upload a new memorywave_v2.apk to that same
      # release (or a new one re-tagged "mobile-apk") whenever the test
      # build changes; no workflow edit needed. Uses the built-in
      # GITHUB_TOKEN, so no extra secret to configure.
      - name: Download test APK from the "mobile-apk" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps
          gh release download mobile-apk --repo "${{ github.repository }}" --pattern "*.apk" --dir apps --clobber
          apk_file=$(ls apps/*.apk | head -n1)
          if [ "$apk_file" != "apps/memorywave_v2.apk" ]; then
            mv "$apk_file" apps/memorywave_v2.apk
          fi
      # Only login.spec.ts and registration.spec.ts: every other mobile spec
      # (audiobooks/home/library/profile/vault/voices) assumes the app is
      # already past "First-Login Verification" — a live face + voice
      # liveness check gated by a LOCAL, per-device/per-app-install flag
      # (auth_service.dart's isVerified), not anything tied to the account
      # server-side. A fresh CI emulator has never passed it, no matter how
      # provisioned the account is, and it cannot be automated without real
      # camera/mic input (confirmed: not something CI can do — see
      # login.spec.ts's "valid credentials" test and the CHANGELOG/
      # QA_WORK_LOG open question it references). login.spec.ts and
      # registration.spec.ts only exercise client-side validation up to
      # that boundary, so they're the only specs that are CI-safe today.
      # Run the full suite manually against a real device/persistent
      # emulator that's already been verified once by a human.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Odiobuk_Pixel_7_API_34
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm run test:mobile -- --spec ./src/mobile/tests/login.spec.ts --spec ./src/mobile/tests/registration.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-report
          path: reports/allure-results
