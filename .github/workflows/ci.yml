name: Automation Suite

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Target environment'
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

jobs:
  web-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [medco, massive-market, odiobuk]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # --grep-invert '@slow' skips the multi-minute narration/generation
      # journeys (odiobuk TC-013/TC-015) — those run on their own via
      # `--grep @slow --workers=1`, not on every push/PR.
      - run: npx playwright test --project=${{ matrix.site }}-${{ matrix.browser }} --grep-invert "@slow"
        env:
          TEST_ENV: ${{ github.event.inputs.test_env || 'dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-report-${{ matrix.site }}-${{ matrix.browser }}
          path: reports/html

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api
        env:
          TEST_ENV: ${{ github.event.inputs.test_env || 'dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/api-html

  mobile-tests:
    runs-on: ubuntu-latest
    # Free: boots its own Android emulator on the runner (KVM-accelerated,
    # standard 1x-cost Linux minutes) instead of paying for BrowserStack/Sauce
    # Labs. CLOUD_PROVIDER stays 'local' (env.config.ts's default), so
    # wdio.conf.ts's own 'appium' service starts the Appium server and the
    # emulator-runner step below provides the device it attaches to.
    env:
      CLOUD_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # KVM hardware acceleration — without this the emulator falls back to
      # software rendering and is too slow to be usable in CI.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # apps/memorywave_v2.apk is gitignored (large binary build output), so
      # it isn't in the checkout. Pulled instead from a GitHub Release asset
      # tagged "mobile-apk" — re-upload a new memorywave_v2.apk to that same
      # release (or a new one re-tagged "mobile-apk") whenever the test
      # build changes; no workflow edit needed. Uses the built-in
      # GITHUB_TOKEN, so no extra secret to configure.
      - name: Download test APK from the "mobile-apk" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps
          gh release download mobile-apk --repo "${{ github.repository }}" --pattern "*.apk" --dir apps --clobber
          mv apps/*.apk apps/memorywave_v2.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Odiobuk_Pixel_7_API_34
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm run test:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-report
          path: reports/allure-results
